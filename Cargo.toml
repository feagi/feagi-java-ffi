[package]
name = "feagi-java-ffi"
version = "0.0.1-beta.0"
edition = "2021"
license = "Apache-2.0"
description = "JNI/C-ABI facade for FEAGI Rust-backed Java SDK"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
feagi-agent = { path = "../feagi-core/crates/feagi-agent", default-features = false }
feagi-io = { path = "../feagi-core/crates/feagi-io" }
feagi-serialization = { path = "../feagi-core/crates/feagi-serialization" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

